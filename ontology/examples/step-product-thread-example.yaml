# Example: STEP-oriented product engineering semantic thread

example_id: example.step_product_engineering_thread
name: STEP Product Engineering Semantic Thread

objects:
  - id: PROD-001
    type: Product
    name: Flight control computer product identity

  - id: VAR-001
    type: Variant
    name: Flight control computer arctic mission variant

  - id: PVER-001
    type: ProductVersion
    name: Flight control computer arctic mission revision C

  - id: PDE-001
    type: ProductDefinition
    name: Flight control computer design definition

  - id: PDE-002
    type: ProductDefinition
    name: Processor module definition

  - id: OCC-001
    type: ProductStructureOccurrence
    name: Processor module usage in FCC assembly

  - id: SHP-001
    type: ShapeRepresentation
    name: AP242 managed model with PMI

  - id: PART-001
    type: Part
    name: Flight control computer assembly

  - id: CHG-210
    type: Change
    name: Processor cooling fin update

  - id: VER-410
    type: VerificationArtifact
    name: Thermal margin analysis report

relationships:
  - source: PROD-001
    predicate: has_variant
    target: VAR-001

  - source: VAR-001
    predicate: has_variant_version
    target: PVER-001

  - source: PROD-001
    predicate: has_version
    target: PVER-001

  - source: PVER-001
    predicate: defines
    target: PDE-001

  - source: PDE-001
    predicate: has_occurrence
    target: OCC-001

  - source: OCC-001
    predicate: references_child_definition
    target: PDE-002

  - source: PDE-001
    predicate: represented_by_shape
    target: SHP-001

  - source: PDE-001
    predicate: corresponds_to
    target: PART-001

  - source: CHG-210
    predicate: affects
    target: PART-001

  - source: SHP-001
    predicate: supports_verification_by
    target: VER-410

reasoning_value: >
  If CHG-210 impacts PART-001, the STEP-aligned graph can trace to product identity (PROD-001),
  governed variant (VAR-001), governing revision (PVER-001), contextual definition (PDE-001),
  assembly usage (OCC-001), child definition impacts (PDE-002), and affected model-based
  verification evidence (VER-410).
