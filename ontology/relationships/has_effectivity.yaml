id: relationship.has_effectivity
name: Has Effectivity
kind: relationship
status: draft
version: 0.1.0

predicate: has_effectivity
inverse_predicate: effectivity_of

summary: >
  Assigns controlled applicability scope to a governed change.

canonical_definition: >
  The has_effectivity relationship links a Change to its Effectivity designation,
  defining where, when, and to which product instances the change applies.

source_entity: Change
target_entity: Effectivity

cardinality:
  source_to_target: many-to-many
  target_to_source: many-to-many

required: false
transitive: false
symmetric: false

semantic_constraints:
  - Effectivity should be explicit for implementation and traceability.
  - Applicability may be serial, model, block, lot, date, NSR, or spares scoped.

lifecycle_constraints:
  - Effectivity should be approved before change release.

source_of_authority:
  system_of_record: PLM / CM system
  authoritative_process: Configuration identification and change control process

examples:
  - source: Landing gear torque spec update
    relationship: has_effectivity
    target: Serial 420 and after
    explanation: The change applies only to the designated serial scope.

anti_examples:
  - source: Change
    relationship: has_effectivity
    target: Unspecified future programs
    explanation: Unbounded applicability is not a controlled effectivity designation.

local_meanings: []
historical_meanings: []

change_history:
  - version: 0.1.0
    date: 2026-07-29
    author: GitHub Copilot
    description: Initial draft.