id: relationship.has_variant_version
name: Has Variant Version
kind: relationship
status: draft
version: 0.1.0

predicate: has_variant_version
inverse_predicate: version_of_variant

summary: >
  Links a variant to configuration-controlled product versions specific to that alternative.

canonical_definition: >
  has_variant_version associates a Variant with ProductVersion objects when revision progression is
  controlled within a specific variant branch, combining STEP-style variant configuration semantics
  with product_definition_formation version control.

source_entity: Variant
target_entity: ProductVersion

cardinality:
  source_to_target: one-to-many
  target_to_source: many-to-one

required: false
transitive: false
symmetric: false

semantic_constraints:
  - Linked ProductVersion should also trace to the same parent Product as the Variant.
  - Use this relationship only when version control is variant-specific rather than only product-wide.

lifecycle_constraints:
  - ProductVersion maturity should not exceed the maturity of the governing Variant branch.

source_of_authority:
  system_of_record: PLM
  authoritative_process: Variant release and revision management

examples:
  - source: Flight control computer arctic mission variant
    relationship: has_variant_version
    target: Flight control computer arctic mission revision C
    explanation: The variant carries its own governed revision progression.

anti_examples:
  - source: Flight control computer product identity
    relationship: has_variant_version
    target: Flight control computer revision C
    explanation: Product identity uses has_version; has_variant_version is only for variant-specific lineage.

local_meanings: []
historical_meanings: []

change_history:
  - version: 0.1.0
    date: 2026-05-28
    author: Copilot task agent
    description: Initial STEP-aligned has_variant_version relationship.
