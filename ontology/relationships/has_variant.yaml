id: relationship.has_variant
name: Has Variant
kind: relationship
status: draft
version: 0.1.0

predicate: has_variant
inverse_predicate: variant_of

summary: >
  Links a product identity to one or more governed variants.

canonical_definition: >
  has_variant associates a Product with Variant records that represent managed alternatives under
  the same product identity, aligned to STEP AP242 configuration-management patterns for handling
  large numbers of product alternatives.

source_entity: Product
target_entity: Variant

cardinality:
  source_to_target: one-to-many
  target_to_source: many-to-one

required: false
transitive: false
symmetric: false

semantic_constraints:
  - Variant must belong to exactly one Product identity.
  - Variant distinguishes approved alternatives, not revision succession.

lifecycle_constraints:
  - Released variants should remain governed by the parent Product identity and its configuration authority.

source_of_authority:
  system_of_record: PLM
  authoritative_process: Product configuration planning and governance

examples:
  - source: Flight control computer product identity
    relationship: has_variant
    target: Flight control computer arctic mission variant
    explanation: One product identity branches into a governed cold-weather alternative.

anti_examples:
  - source: Flight control computer revision C
    relationship: has_variant
    target: Flight control computer revision D
    explanation: Revision-to-revision progression is version control, not variant branching.

local_meanings: []
historical_meanings: []

change_history:
  - version: 0.1.0
    date: 2026-05-28
    author: Copilot task agent
    description: Initial STEP-aligned has_variant relationship.
