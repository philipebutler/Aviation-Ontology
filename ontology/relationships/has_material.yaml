id: relationship.has_material
name: Has Material
kind: relationship
status: draft
version: 0.1.0

predicate: has_material
inverse_predicate: used_by

summary: >
  Links a part to the governed material specification it is made from.

canonical_definition: >
  The has_material relationship asserts that a Part is manufactured from a specified
  Material. The material is a separately governed specification entity, not an attribute
  value, enabling independent material qualification, substitution control, and traceability.

source_entity: Part
target_entity: Material

cardinality:
  source_to_target: many-to-many
  target_to_source: one-to-many

required: false
transitive: false
symmetric: false

semantic_constraints:
  - A part may reference multiple materials when different features use different specifications.
  - Material must be governed under an approved specification before assignment to a released part.

lifecycle_constraints:
  - Material assignment should be established at part release and change-controlled thereafter.

source_of_authority:
  system_of_record: PLM / material specification database
  authoritative_process: Materials qualification and configuration management process

examples:
  - source: Wing rib part
    relationship: has_material
    target: 7075-T73 aluminum alloy
    explanation: The wing rib is machined from approved 7075-T73 per AMS 2770.

anti_examples:
  - source: Part
    relationship: has_material
    target: Assembly
    explanation: An assembly is not a material; the relationship applies to specification-controlled substances.

local_meanings: []
historical_meanings: []

change_history:
  - version: 0.1.0
    date: 2026-08-15
    author: GitHub Copilot
    description: Initial definition linking Part to governed Material specification.
