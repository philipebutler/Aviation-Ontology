id: entity.change_governance_authority
name: ChangeGovernanceAuthority
kind: entity
status: draft
version: 0.1.0

summary: >
  A governance authority concept for entities that review, recommend, or decide change dispositions.

canonical_definition: >
  ChangeGovernanceAuthority is the generic semantic parent for governance entities that
  participate in controlled change review, recommendation, and disposition authority.

purpose: >
  This entity normalizes governance actor semantics and enables consistent modeling of
  advisory and decision authority roles in change management.

semantic_scope:
  includes:
    - Review and recommendation authorities.
    - Final disposition authorities.
    - Scope-bound governance authority semantics.
  excludes:
    - Non-governed contributors and informal reviewers.

standards_alignment:
  eia_649c:
    concept: Change board and approval authority
    notes: Supports normalized CM governance authority semantics.
  iso_10007:
    concept: Dispositioning authority context
    notes: Aligns with formal disposition governance.

ownership:
  business_owner: Engineering Governance
  semantic_owner: Configuration Management
  steward: TBD
  approving_authority: TBD

source_of_authority:
  system_of_record: Governance records
  authoritative_artifact: Charters and authority delegations
  authoritative_process: Change governance process

attributes:
  - name: id
    description: Unique governance authority identifier.
    required: true
    datatype: string
  - name: authority_type
    description: Authority type such as advisory board or approval authority.
    required: true
    datatype: string
  - name: scope
    description: Product, program, or class scope of authority.
    required: true
    datatype: string

relationships:
  - predicate: governs
    target_entity: Change
    cardinality: many-to-many
    required: false
    description: Governance authority participates in change governance.

lifecycle_states:
  - active
  - suspended
  - retired

local_definitions: []
historical_definitions: []
aliases:
  - governance authority

not_to_be_confused_with:
  - concept: ChangeAuthorizationArtifact
    distinction: Governance authority is an actor/authority concept; authorization artifacts are records.

examples:
  - name: Program governance authority
    description: Authority with defined scope over program-level changes.

anti_examples:
  - name: Informal reviewer
    description: Informal reviewers are not governance authorities.

open_questions:
  - Should role and organization decomposition be modeled in a separate identity ontology?

change_history:
  - version: 0.1.0
    date: 2026-07-29
    author: GitHub Copilot
    description: Initial draft.
