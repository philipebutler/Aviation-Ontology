id: entity.allocated_baseline
name: AllocatedBaseline
kind: entity
status: draft
version: 0.1.0

summary: >
  The baseline state capturing approved allocated requirements from higher-level systems to lower-level configured items.

canonical_definition: >
  AllocatedBaseline is the approved baseline state that captures requirements allocated
  from higher-level systems or items to lower-level configuration items and interfaces.

purpose: >
  Allocated baseline semantics provide traceable decomposition between functional intent
  and detailed product realization.

semantic_scope:
  includes:
    - Allocation of functional and interface requirements to lower-level items.
    - Approved intermediate baseline context between functional and product baselines.
  excludes:
    - Pure top-level functional statements with no allocation.
    - Final build-to detailed design package.

standards_alignment:
  eia_649_2a:
    concept: Allocated baseline (ABL)
    notes: Aligns with formal baseline progression semantics.

ownership:
  business_owner: Systems Engineering
  semantic_owner: Configuration Management
  steward: TBD
  approving_authority: TBD

source_of_authority:
  system_of_record: PLM / requirements and interface repositories
  authoritative_artifact: Approved allocated baseline package
  authoritative_process: Baseline approval and allocation governance process

attributes:
  - name: id
    description: Unique allocated baseline identifier.
    required: true
    datatype: string
  - name: status
    description: Baseline status.
    required: true
    datatype: string

relationships:
  - predicate: precedes
    target_entity: ProductBaseline
    cardinality: one-to-many
    required: false
    description: Allocated baseline precedes product baseline realization.
  - predicate: references
    target_entity: ConfigurationBaseline
    cardinality: many-to-one
    required: false
    description: Allocated baseline specialization references general baseline semantics.

lifecycle_states:
  - proposed
  - approved
  - active
  - superseded

local_definitions: []
historical_definitions: []
aliases:
  - ABL

not_to_be_confused_with:
  - concept: FunctionalBaseline
    distinction: Functional baseline captures high-level obligations; allocated baseline captures lower-level assignment.

examples:
  - name: Avionics subsystem allocated baseline
    description: Approved allocation of aircraft-level requirements into avionics subsystem requirements.

anti_examples:
  - name: Program mission statement
    description: Mission statements are not allocated baseline artifacts.

open_questions:
  - Should interface allocations be modeled with a dedicated relationship in a later wave?

change_history:
  - version: 0.1.0
    date: 2026-07-29
    author: GitHub Copilot
    description: Initial draft.
